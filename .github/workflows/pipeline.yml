name: Autonomous Pipeline Run

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC - one full loop iteration
  workflow_dispatch: {}     # allow manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_BASE_URL: https://fwwk4pb868-afk.github.io/biznis

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ensure Chrome is available (used to export ebook/sop PDFs)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - run: python3 scripts/run_pipeline.py
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Crawl-readiness audit (non-fatal for now - see ROADMAP.md)
        run: python3 scripts/audit_site.py || true

      - name: Commit updated database, reports and site
        run: |
          git config user.name "biznis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db/biznis.sqlite3 db/indexnow_key.txt data/exports site
          git diff --cached --quiet || git commit -m "chore: pipeline run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ping IndexNow now that the key file is actually live
        run: python3 scripts/ping_indexnow.py || true
