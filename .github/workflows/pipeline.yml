name: Autonomous Pipeline Run

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC - one full loop iteration
  workflow_dispatch: {}     # allow manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_BASE_URL: https://biznis-studio.github.io
  FORMSPREE_ENDPOINT: https://formspree.io/f/xykrlrjz
  GOOGLE_SITE_VERIFICATION: wSzc38h_LgWxBpKFU09fpxDk6_tdnplhjOgWRJ23ilA
  # Stored as a repo secret - the repository is public, so the key
  # must never appear in committed files.
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ensure Chrome is available (used to export ebook/sop PDFs)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - run: python3 scripts/run_pipeline.py
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Crawl-readiness audit (non-fatal for now - see ROADMAP.md)
        run: python3 scripts/audit_site.py || true

      # Kontroly, ktore doteraz existovali, ale nikto ich nespustal - cize
      # boli len radou. Nezhadzuju beh: mrtvy externy odkaz ani slub po
      # termine nie su dovod nevydat web, ale musia byt vidno v zhrnuti.
      - name: Rucne pisane popisy do databazy
        run: python3 scripts/apply_blurbs.py || true

      - name: Externe odkazy
        run: |
          echo "### Externe odkazy" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check_external_links.py >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Sluby aktiv
        run: |
          echo "### Sluby aktiv" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check_promises.py >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      # Blokujuca brana. Testy reprodukuju pad procesu uprostred uzla; ak
      # prestane platit atomicita, bezobsluzny beh zacne duplikovat zapisy -
      # co uz raz nastalo 2026-08-17 a stalo to rucne zmierovanie databaz.
      - name: Regresne testy behu (blokujuce)
        run: |
          python3 tests/test_beh.py
          python3 tests/test_vyklad.py

      # Blokujuca brana. CLAUDE.md tvrdil, ze zakaznicke udaje v repozitari
      # blokuje `quality-packs/build/build_pack.py --check`. Ten skript
      # existuje a funguje, ale zije v susednom projekte ~/Desktop/quality-packs
      # a strazi PACK, nie tento repozitar - v tomto CI ho nikdy nic nespustilo.
      # Pravidlo teda nevynucovalo nic a 2026-08-18 sa ukazalo, ze mena
      # zakaznikov su na verejnom origin/main. (Upresnene 2026-08-19.)
      - name: Zakaznicke udaje v repozitari (blokujuce)
        run: python3 scripts/kontrola_repozitara.py

      # Blokujuca brana na pravopis /sk/. Prva verzia porovnavala len slova
      # so zriedkavymi pismenami a hlasila "OK", kym na zivom webe sedelo
      # sest preklepov s beznymi pismenami (vyjst, sami, zakazku, napriklad,
      # nevypnete, ponuky). Preto aspell so slovenskym slovnikom: z ~9 500
      # slov oznaci ~90 neznamych a to su skoro same nazvy a anglicizmy,
      # ktore drzime v schvalenom zozname. Bez slovnika kontrola ZLYHA
      # nahlas - ticho prejst by z nej spravilo ozdobu.
      - name: Slovencina - aspell a slovensky slovnik
        run: sudo apt-get update -qq && sudo apt-get install -y -qq aspell aspell-sk

      - name: Slovencina na /sk/ (blokujuce)
        run: python3 scripts/kontrola_slovenciny.py

      # Odkaz vo vete nesmie preniest citatela do ineho jazyka. 2026-08-22:
      # anglicka domovska sluboval "our free pre-deployment record" a odkaz
      # viedol na slovensky formular. Ziadna existujuca brana to nechytila
      # a chytit nemohla - ciel vracia 200, je v sitemape, ma kanonicku
      # adresu. Chybny bol len jazyk. Prepinac jazyka je vynimka: patri do
      # nav/header/footer alebo nesie hreflang.
      - name: Jazyk odkazov v proze (blokujuce)
        run: python3 scripts/kontrola_jazyka_odkazov.py

      # Chranena cesta Frontieru: snimanie + zapis cakajucich artefaktov
      # vykladu. Bezi cez zamok, kontrolne body a rozpocet, takze pad v
      # polovici nenecha polovicu stavu. Artefakty vyroba uvazovacia rovina
      # (relacia alebo cloudovy worker) a commituje ich ako maly JSON;
      # zapisuje ich vzdy len tento jediny pisatel.
      - name: Frontier - snimanie a zapis artefaktov vykladu
        run: python3 scripts/frontier_run.py

      # Hrana z merania spat do rozhodovania. Zvysok pipeline veci vyraba;
      # toto sa pyta, ci sa mali vyrabat, a co si system pyta ako dalsie.
      - name: Evolucny beh - co si system pyta dalej
        run: |
          echo "### Co si system pyta dalej" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/evolve.py --seed >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated database, reports and site
        run: |
          git config user.name "biznis-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/image_credits.json MUSI byt v zozname: 2026-08-16 pipeline
          # commitol dva nove obrazky bez ich atribucie, lebo tento riadok
          # ju nezahrnal. Publikovat fotku bez zaznamu o zdroji nechceme.
          git add db/biznis.sqlite3 db/indexnow_key.txt data/exports data/image_credits.json site
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: pipeline run $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # A bare `git push` here fails the whole run - deploy included -
          # whenever anyone pushes while the pipeline is mid-flight, which
          # is a normal thing to do and happened repeatedly during a
          # working session. Retry on top of whatever landed meanwhile.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto origin/main."
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              # Conflicts here are between two sets of generated artefacts.
              # Resolving them blindly could discard real work, so abort and
              # let this run's commit go. Everything committed here is
              # regenerated from source on the next run, and the deploy step
              # below still publishes the site built in this run.
              git rebase --abort || true
              echo "::warning::Rebase conflicted; skipping this run's commit. Deploy continues."
              exit 0
            fi
          done
          echo "::warning::Could not push after 3 attempts. Deploy continues."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ping IndexNow now that the key file is actually live
        run: |
          echo "### IndexNow" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ping_indexnow.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
