name: Autonomous Pipeline Run

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC - one full loop iteration
  workflow_dispatch: {}     # allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python3 scripts/run_pipeline.py

      - name: Commit updated database and reports
        run: |
          git config user.name "biznis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db/biznis.sqlite3 data/exports
          git diff --cached --quiet || git commit -m "chore: pipeline run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
